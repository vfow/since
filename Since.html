<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
    color: #fff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
  }

  #time {
    font-size: clamp(1.75rem, 6vw, 6rem);
    font-weight: 400;
    line-height: 1;
    text-align: center;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="time"></div>

<script>
  const start = new Date(2024, 6, 1, 0, 0, 0, 0);
  const display = document.getElementById('time');
  const MS_PER_SECOND = 1000;
  const MS_PER_MINUTE = 60 * MS_PER_SECOND;
  const MS_PER_HOUR = 60 * MS_PER_MINUTE;
  const MS_PER_DAY = 24 * MS_PER_HOUR;

  function update() {
    const now = new Date();

    let years = now.getFullYear() - start.getFullYear();
    let cursor = new Date(start);
    cursor.setFullYear(start.getFullYear() + years);

    if (cursor > now) {
      years--;
      cursor = new Date(start);
      cursor.setFullYear(start.getFullYear() + years);
    }

    let months = now.getMonth() - cursor.getMonth();
    if (months < 0) months += 12;

    let monthCursor = new Date(cursor);
    monthCursor.setMonth(cursor.getMonth() + months);

    if (monthCursor > now) {
      months--;
      if (months < 0) {
        months = 11;
        years--;
        cursor = new Date(start);
        cursor.setFullYear(start.getFullYear() + years);
        monthCursor = new Date(cursor);
        monthCursor.setMonth(cursor.getMonth() + months);
      } else {
        monthCursor = new Date(cursor);
        monthCursor.setMonth(cursor.getMonth() + months);
      }
    }

    let remaining = now.getTime() - monthCursor.getTime();

    const days = Math.floor(remaining / MS_PER_DAY);
    remaining %= MS_PER_DAY;

    const hours = Math.floor(remaining / MS_PER_HOUR);
    remaining %= MS_PER_HOUR;

    const minutes = Math.floor(remaining / MS_PER_MINUTE);
    remaining %= MS_PER_MINUTE;

    const seconds = Math.floor(remaining / MS_PER_SECOND);

    display.textContent = `${years}y ${months}m ${days}d ${hours}h ${minutes}m ${seconds}s`;
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
